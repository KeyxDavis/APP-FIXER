  build-linux:
    name: Build for linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Kivy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgl1-mesa-dev libgles2-mesa-dev libgstreamer1.0-dev \
            libmtdev-dev xclip xsel libjpeg-dev \
            xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy
          pip install "pyinstaller<6.10"
          pip install -r requirements.txt   # if you have one

      - name: Build app
        env:
          KIVY_WINDOW: sdl2
          KIVY_GL_BACKEND: gl
        run: |
          pyinstaller --noconfirm \
            --hidden-import=kivy.core.window.window_sdl2 \
            --hidden-import=kivy.core.text.text_sdl2 \
            --hidden-import=kivy.core.image.img_sdl2 \
            main.py   # replace with your entry script, or use your .spec file

      - name: Package Linux build
        run: |
          cd dist
          tar -czf ../app-linux.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: app-linux.tar.gz
