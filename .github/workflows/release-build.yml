name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            shell: pwsh
            build_cmd: ./build_windows.bat
          - os: ubuntu-latest
            name: linux
            shell: bash
            build_cmd: bash ./build_linux.sh
          - os: macos-latest
            name: macos
            shell: bash
            build_cmd: bash ./build_macos.sh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build app
        run: ${{ matrix.build_cmd }}

      - name: Package Windows build
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\AsoloAttendance.exe -DestinationPath AsoloAttendance-windows-x64.zip -Force

      - name: Package Linux build
        if: matrix.name == 'linux'
        shell: bash
        run: tar -czf AsoloAttendance-linux-x64.tar.gz -C dist AsoloAttendance

      - name: Package macOS build
        if: matrix.name == 'macos'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/AsoloAttendance.app AsoloAttendance-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsoloAttendance-${{ matrix.name }}
          path: AsoloAttendance-*

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" AsoloAttendance-* --clobber
