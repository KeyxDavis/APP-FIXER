name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            shell: pwsh
            build_cmd: ./build_windows.bat
          - os: ubuntu-latest
            name: linux
            shell: bash
            build_cmd: bash ./build_linux.sh
          - os: macos-latest
            name: macos
            shell: bash
            build_cmd: bash ./build_macos.sh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build app
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsoloAttendance-${{ matrix.name }}
          path: |
            dist/**
            !dist/**/**/*.py
