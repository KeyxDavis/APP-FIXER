name: Build Desktop Releases

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS BUILD
  # ============================================================
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify files
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Files:"
          Get-ChildItem

          Write-Host ""
          Write-Host "Checking application file..."
          if (-not (Test-Path "STAFF ATTENDANCE(GENERAL)KIVY.py")) {
              Write-Error "STAFF ATTENDANCE(GENERAL)KIVY.py was not found."
              exit 1
          }

          Write-Host "Application file found."

      - name: Build Windows application
        shell: cmd
        run: |
          call build_windows.bat

      - name: Verify Windows build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AsoloAttendance.exe")) {
              Write-Error "Windows build was not created."
              exit 1
          }

          Write-Host "Windows build created successfully."
          Get-Item "dist\AsoloAttendance.exe"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\windows | Out-Null

          Copy-Item "dist\AsoloAttendance.exe" "release\windows\AsoloAttendance.exe"

          if (Test-Path "dist\asolo_config.json") {
              Copy-Item "dist\asolo_config.json" "release\windows\asolo_config.json"
          }

          Compress-Archive `
            -Path "release\windows\*" `
            -DestinationPath "AsoloAttendance-Windows.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsoloAttendance-Windows
          path: AsoloAttendance-Windows.zip


  # ============================================================
  # LINUX BUILD
  # ============================================================
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Kivy
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libgstreamer1.0-dev \
            libmtdev-dev \
            xclip \
            xsel \
            libjpeg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking application file..."

          if [ ! -f "STAFF ATTENDANCE(GENERAL)KIVY.py" ]; then
            echo "ERROR: STAFF ATTENDANCE(GENERAL)KIVY.py was not found."
            exit 1
          fi

          echo "Application file found."

      - name: Make Linux build script executable
        run: |
          chmod +x build_linux.sh

      - name: Build Linux application
        run: |
          ./build_linux.sh

      - name: Verify Linux build
        run: |
          echo "Checking dist directory..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          ls -la dist

      - name: Package Linux build
        run: |
          mkdir -p release/linux

          cp -r dist/* release/linux/

          tar -czf AsoloAttendance-Linux.tar.gz -C release/linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsoloAttendance-Linux
          path: AsoloAttendance-Linux.tar.gz


  # ============================================================
  # MACOS BUILD
  # ============================================================
  build-macos:
    name: Build for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew update

          brew install \
            sdl2 \
            sdl2_image \
            sdl2_mixer \
            sdl2_ttf \
            gstreamer

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking application file..."

          if [ ! -f "STAFF ATTENDANCE(GENERAL)KIVY.py" ]; then
            echo "ERROR: STAFF ATTENDANCE(GENERAL)KIVY.py was not found."
            exit 1
          fi

          echo "Application file found."

      - name: Make macOS build script executable
        run: |
          chmod +x build_macos.sh

      - name: Build macOS application
        run: |
          ./build_macos.sh

      - name: Verify macOS build
        run: |
          echo "Checking dist directory..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          ls -la dist

      - name: Package macOS build
        run: |
          mkdir -p release/macos

          cp -r dist/* release/macos/

          tar -czf AsoloAttendance-macOS.tar.gz -C release/macos .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsoloAttendance-macOS
          path: AsoloAttendance-macOS.tar.gz


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================
  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AsoloAttendance-Windows
          path: release-files

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AsoloAttendance-Linux
          path: release-files

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AsoloAttendance-macOS
          path: release-files

      - name: Show release files
        run: |
          echo "Files going into release:"
          ls -lh release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/AsoloAttendance-Windows.zip
            release-files/AsoloAttendance-Linux.tar.gz
            release-files/AsoloAttendance-macOS.tar.gz
          generate_release_notes: true
